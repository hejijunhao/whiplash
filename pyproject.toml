# Dependency metadata for Hermes (it reads [project].dependencies when installing
# the plugin) and for local dev. Whiplash is loaded by Hermes from this directory,
# not built or published as a wheel, hence no [build-system].
[project]
name = "whiplash"
version = "0.8.0"
description = "Hermes Agent plugin: jam on an Elektron Digitakt II over USB MIDI."
readme = "README.md"
license = "MIT"
authors = [{ name = "pgbouncer" }]
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3,<2",
    "python-rtmidi>=1.5,<2",
]

# Optional: whiplash_listen (v0.7) captures the Digitakt II's USB audio. Without these the plugin loads and
# every other tool works; whiplash_listen says how to install them.
[project.optional-dependencies]
listen = [
    "numpy>=1.24,<3",
    "sounddevice>=0.4.6,<0.6",
]

[project.urls]
Repository = "https://github.com/hejijunhao/whiplash"

[dependency-groups]
dev = [
    "numpy>=1.24,<3",  # the listen analysis tests; sounddevice is never needed (fake input streams)
    "pytest>=8,<10",
    "pyyaml>=6,<7",
]

[tool.uv]
package = false
# CI only (uv reads this; pip and Hermes ignore it): python-rtmidi has no dependencies, but its meson build has no
# metadata hook, so uv would compile it (needing ALSA headers on Linux) just to resolve it where PyPI has no wheel
# (py3.13 on Linux). With this, CI there can `uv sync --no-install-package python-rtmidi`; the tests use fake ports.
dependency-metadata = [{ name = "python-rtmidi", requires-dist = [] }]

[tool.pytest.ini_options]
testpaths = ["tests"]
