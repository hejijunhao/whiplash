name: tests

on:
  push:
    branches: [feat/v1, feat/v2, feat/v04, feat/visualiser, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: ALSA runtime for python-rtmidi
        if: runner.os == 'Linux'
        # Retries, then falls back to the runtime libasound.so.2 the runner image ships if the apt mirrors are
        # down (Nov 11 2026: security.ubuntu.com and the mirror failed for every run for an hour). The rtmidi
        # wheel only needs the runtime library.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update && \
               sudo apt-get -o Acquire::Retries=3 install -y libasound2-dev; then exit 0; fi
            echo "apt attempt $attempt failed"; sleep 15
          done
          if ldconfig -p | grep -q 'libasound.so.2 '; then
            echo "::warning::apt unavailable; using the runner's preinstalled libasound.so.2"
          else
            echo "::error::apt unavailable and no libasound.so.2 on the runner"; exit 1
          fi
      - name: Install dependencies from pyproject.toml
        run: uv sync
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: jsdom for the visualiser render check (tests/test_view_harmony.py)
        run: |
          npm install --prefix "$RUNNER_TEMP/js" --no-audit --no-fund jsdom@24.1.3
          echo "NODE_PATH=$RUNNER_TEMP/js/node_modules" >> "$GITHUB_ENV"
          echo "WHIPLASH_JSDOM=required" >> "$GITHUB_ENV"
      - name: Tests
        run: uv run pytest -q -rs
