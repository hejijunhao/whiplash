name: tests

on:
  push:
    branches: [feat/v1, feat/v2, feat/v04, feat/visualiser, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: ALSA runtime for python-rtmidi
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install dependencies from pyproject.toml
        run: uv sync
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: jsdom for the visualiser render check (tests/test_view_harmony.py)
        run: |
          npm install --prefix "$RUNNER_TEMP/js" --no-audit --no-fund jsdom@24.1.3
          echo "NODE_PATH=$RUNNER_TEMP/js/node_modules" >> "$GITHUB_ENV"
          echo "WHIPLASH_JSDOM=required" >> "$GITHUB_ENV"
      - name: Tests
        run: uv run pytest -q -rs
      - name: Clock timing on this runner (informational; docs/testing/clock-jitter.md)
        if: always()
        continue-on-error: true
        run: |
          uv run python scripts/clock_jitter.py --runs 3 --seconds 20
          uv run python scripts/clock_jitter.py --runs 3 --seconds 40 --speed 4
          uv run python scripts/clock_jitter.py --runs 2 --seconds 20 --load 3
