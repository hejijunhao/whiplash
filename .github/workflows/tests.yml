name: tests

on:
  push:
    branches: [feat/v1, feat/v2, feat/v04, feat/visualiser, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: ALSA runtime for python-rtmidi
        if: runner.os == 'Linux'
        # python-rtmidi's wheel only needs the runtime libasound.so.2. Use the runner image's copy when it has
        # one; otherwise install it, with a hard timeout per attempt (Nov 11 2026: the apt mirrors hung or failed
        # for every run for over an hour, and a hung apt ate the whole 10-minute job).
        run: |
          if ldconfig -p | grep -q 'libasound.so.2 '; then echo "libasound.so.2 already on the runner"; exit 0; fi
          for attempt in 1 2; do
            if sudo timeout 60 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update && \
               sudo timeout 60 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y libasound2t64 \
                 || sudo timeout 60 apt-get install -y libasound2; then exit 0; fi
            echo "apt attempt $attempt failed"; sleep 10
          done
          echo "::error::no libasound.so.2 on the runner and apt unavailable"; exit 1
      - name: Install dependencies from pyproject.toml
        # PyPI has no Linux py3.13 wheel for python-rtmidi 1.5.8, so on a uv cache miss (setup-uv keys it on
        # pyproject.toml, so every version bump misses) uv builds it from source, which needs the ALSA headers.
        # Fetch them only then, with timed, retried apt attempts (the mirrors hung for hours on Nov 11 2026).
        run: |
          if uv sync; then exit 0; fi
          if [ "$RUNNER_OS" != "Linux" ] || pkg-config --exists alsa; then exit 1; fi
          echo "uv sync failed without the ALSA headers (python-rtmidi source build?); installing libasound2-dev"
          for attempt in 1 2 3; do
            if sudo timeout 90 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update && \
               sudo timeout 90 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y libasound2-dev
            then uv sync; exit $?; fi
            echo "apt attempt $attempt failed"; sleep 10
          done
          echo "::error::python-rtmidi needs the ALSA headers to build here and apt is unavailable; rerun later"; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: jsdom for the visualiser render check (tests/test_view_harmony.py)
        run: |
          npm install --prefix "$RUNNER_TEMP/js" --no-audit --no-fund jsdom@24.1.3
          echo "NODE_PATH=$RUNNER_TEMP/js/node_modules" >> "$GITHUB_ENV"
          echo "WHIPLASH_JSDOM=required" >> "$GITHUB_ENV"
      - name: Tests
        run: uv run pytest -q -rs
