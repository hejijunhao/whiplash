<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiplash Live</title>
<style>
/* Whiplash live view, pixel-art rack. Strict grayscale: everything below is one of these tokens.
   One "art pixel" is 2 CSS px: borders, LEDs, font pixels and cable widths are all multiples of it. */
:root {
  --bg: #171717; --panel: #333333; --mid: #808080; --mid2: #8A8A8A; --hi: #F0F0F0;
  --dark: #0E0E0E; --off: #1F1F1F; --dim: #5C5C5C; --dot: #2C2C2C;
  --mono: ui-monospace, Menlo, Monaco, "Courier New", monospace;
  --agent-w: 440px; --log-h: 44px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; color: var(--hi); }
body {
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: none; -moz-osx-font-smoothing: grayscale; font-smooth: never;
  /* pegboard: small dark-gray dots on near-black */
  background-color: var(--bg);
  background-image: radial-gradient(circle, var(--dot) 1.4px, transparent 1.6px);
  background-size: 16px 16px; background-position: 8px 8px;
}
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
svg { shape-rendering: crispEdges; display: block; }
button, select { font: inherit; color: inherit; letter-spacing: inherit; }
.hidden { display: none !important; }
.up { text-transform: uppercase; }

#app { display: grid; height: 100vh; grid-template-columns: minmax(0, 1fr) var(--agent-w); }
#app.collapsed { grid-template-columns: minmax(0, 1fr) 48px; }
#main { display: grid; grid-template-rows: minmax(0, 1fr) var(--log-h); min-width: 0; min-height: 0; }

/* ---- rack --------------------------------------------------------------- */
#rack { position: relative; overflow: auto; min-height: 0; padding: 24px 24px 40px; display: grid; gap: 32px 24px; align-content: start;
  grid-template-columns: minmax(340px, 1.5fr) minmax(200px, 0.8fr) minmax(250px, 1fr); scrollbar-width: thin; scrollbar-color: var(--mid) transparent; }
#cables { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 5; overflow: visible; }
#cables path { fill: none; stroke: var(--hi); stroke-width: 2; stroke-linecap: square; }
#cables path.quiet { stroke: var(--mid); stroke-dasharray: 4 4; }
body.nocables #cables { display: none; }
.mod { position: relative; background: var(--panel); border: 2px solid var(--mid2); padding: 8px 10px 10px; min-width: 0; }
.mhead { display: flex; align-items: center; gap: 8px; height: 22px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 2px solid var(--dark); }
.mhead .sp { flex: 1; }
.role.kit { color: var(--hi); }   /* the user's own label (whiplash_label_tracks), not an assumed role */
.tag.slot { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.role { color: var(--mid2); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lbl-txt { color: var(--mid2); text-transform: uppercase; font-size: 11px; }
.led { display: inline-block; width: 4px; height: 4px; background: var(--off); flex: none; }
.led.on { background: var(--hi); }
.led.big { width: 6px; height: 6px; }
.jack { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--dark); border: 3px solid var(--hi); flex: none; }
.jack.sm { width: 12px; height: 12px; border-width: 2px; border-color: var(--mid2); }
.jack.patched { border-color: var(--hi); }
.screw { position: absolute; width: 4px; height: 4px; background: var(--mid); }
.screw.tl { left: 3px; top: 3px; } .screw.tr { right: 3px; top: 3px; } .screw.bl { left: 3px; bottom: 3px; } .screw.br { right: 3px; bottom: 3px; }

/* tape / transport */
#tape .tb { display: flex; gap: 16px; align-items: flex-start; }
#cassette { width: 180px; height: 114px; flex: none; }
#cassette .body { fill: var(--off); stroke: var(--hi); stroke-width: 2; }
#cassette .label { fill: var(--mid); }
#cassette .win { fill: var(--dark); stroke: var(--mid); stroke-width: 2; }
#cassette .pack { fill: var(--mid); }
#cassette .hubr { fill: var(--bg); stroke: var(--hi); stroke-width: 2; }
#cassette .spoke { fill: var(--hi); }
#cassette .head { fill: var(--dark); stroke: var(--mid); stroke-width: 2; }
#cassette .tapeline { stroke: var(--mid2); stroke-width: 2; }
#cassette .scr { fill: var(--mid); }
.readout { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
#bpmRow { align-items: flex-end; }
#posStrip { width: 100%; height: 14px; margin-top: 10px; }
#barLeds { display: flex; gap: 6px; align-items: center; }
#portRow { margin-top: 10px; display: flex; align-items: center; gap: 8px; min-width: 0; }
#portName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
#portErr { color: var(--mid2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
.inv { background: var(--hi); color: var(--bg); padding: 0 4px; }
.blink { animation: blink 1s steps(2, start) infinite; }
.blink.fast { animation-duration: 0.4s; }
@keyframes blink { to { visibility: hidden; } }

/* hub */
#hub { display: flex; flex-direction: column; }
#hubBox { position: relative; flex: 1; min-height: 140px; }
#hubCv { position: absolute; inset: 0; width: 100%; height: 100%; }

/* master */
#vuBox { position: relative; height: 110px; background: var(--off); border: 2px solid var(--mid); }
#vu { position: absolute; inset: 0; width: 100%; height: 100%; }
#srcLine { margin-top: 6px; color: var(--mid2); text-transform: uppercase; font-size: 11px; min-height: 14px; }
#inJacks { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px 4px; margin-top: 8px; justify-items: center; }
#inJacks .j { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 9px; color: var(--dim); }
#masterCtl { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
#audioDev { max-width: 200px; background: var(--dark); border: 2px solid var(--mid); color: var(--hi); text-transform: uppercase; font-size: 11px; }

/* key / chords (v0.6.0): the key, the progression, the chord now and the one coming on the bar */
#harm { grid-column: 1 / -1; }
#keyName { font-size: 14px; letter-spacing: 0.12em; white-space: nowrap; }
#chordRow { display: flex; flex-wrap: wrap; gap: 8px; }
.cell { position: relative; min-width: 76px; padding: 4px 8px 6px; background: var(--dark); border: 2px solid var(--mid); display: flex; flex-direction: column; gap: 2px; }
.cell .num { font-size: 18px; line-height: 22px; letter-spacing: 0.04em; white-space: nowrap; }   /* case matters: i = minor, I = major */
.cell .cname { color: var(--mid2); white-space: nowrap; }
.cell .cnotes { font-size: 10px; color: var(--mid2); white-space: nowrap; }
.cell .cbars { display: flex; gap: 2px; margin-top: 2px; min-height: 4px; }
.cell .cbars i { width: 4px; height: 4px; background: var(--off); }
.cell .cbars i.on { background: var(--hi); }
.cell.now { background: var(--hi); border-color: var(--hi); color: var(--bg); }
.cell.now .cname, .cell.now .cnotes { color: var(--panel); }
.cell.now .cbars i { background: var(--mid); } .cell.now .cbars i.on { background: var(--bg); }
.cell.next { border: 2px dashed var(--hi); }
.cell .cue { position: absolute; right: 4px; top: 4px; display: flex; gap: 2px; }
#harmFoot { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; min-height: 14px; }
#nextKey { color: var(--hi); font-size: 11px; }
.chd { margin-top: 6px; font-size: 10px; color: var(--mid2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 12px; }
.chd b { color: var(--hi); font-weight: normal; }

/* section timeline (v0.6.1 arrangement): the song on bar lines, the playhead, what is scheduled ahead */
#tl { grid-column: span 2; }
#tlBox { position: relative; height: 78px; background: var(--dark); border: 2px solid var(--mid); }
#tlCv { position: absolute; inset: 0; width: 100%; height: 100%; }
#tlFoot { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-top: 8px; min-height: 14px; }
#tlNext { display: inline-flex; gap: 6px; align-items: center; color: var(--hi); font-size: 11px; text-transform: uppercase; }
#tlEvents { color: var(--mid2); font-size: 11px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }

/* EAR (v0.7.0 listening loop): what the last whiplash_listen heard, plus a live spectrum from CONNECT AUDIO */
#earBox { position: relative; height: 96px; background: var(--dark); border: 2px solid var(--mid); }
#earCv { position: absolute; inset: 0; width: 100%; height: 100%; }
#earRead { display: flex; gap: 4px 12px; flex-wrap: wrap; margin-top: 8px; min-height: 14px; font-size: 11px; }
#earRead b { color: var(--hi); font-weight: normal; }
#earRead span { color: var(--mid2); white-space: nowrap; }
#earNote { margin-top: 6px; min-height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ear.stale #earBox, #ear.stale #earRead { opacity: 0.55; }

/* track modules */
#tracks, #tracksHi { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 40px 24px; align-content: start; }
.trk .tb { display: grid; grid-template-columns: 26px minmax(0, 1fr) 52px; gap: 8px; align-items: start; }
.fader { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.fader .slot { position: relative; width: 4px; height: 74px; background: var(--dark); }
.fader .thumb { position: absolute; left: -9px; width: 22px; height: 8px; background: var(--mid2); border-top: 2px solid var(--hi); border-bottom: 2px solid var(--dark); }
.fader .thumb.unknown { background: transparent; border: 2px dashed var(--mid); }
.knobs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 4px; }
.knob { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.knob svg { width: 26px; height: 26px; }
.knob .kb { fill: var(--mid); }
.knob .kd, .knob .kc { fill: var(--hi); }
.knob .kt rect { fill: var(--hi); }
.knob.unknown .kb { fill: var(--dim); }
.kv { font-size: 10px; color: var(--mid2); min-height: 12px; white-space: nowrap; }
.knob.ramp .kv { color: var(--hi); }
.nb { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.notebox { width: 52px; height: 26px; background: var(--dark); border: 2px solid var(--mid); display: flex; align-items: center; justify-content: center; }
.bat svg { width: 16px; height: 32px; }
.bat .br { fill: var(--dark); stroke: var(--hi); stroke-width: 2; }
.bat .bl { fill: var(--hi); }
.strip { width: 100%; height: 12px; margin-top: 8px; }
.strip.roll { height: 26px; }   /* a written part: a tiny piano roll, pitch up, length across */
.rng { margin-top: 2px; }
/* tracks 9-16 (written parts, or generated parts the kit map routed there): their own row under 1-8, so 1-8 never reflow */
#hiHead { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding-top: 8px; border-top: 2px dashed var(--mid); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; min-height: 16px; }
.tag { font-size: 10px; padding: 0 4px; border: 2px solid var(--mid); color: var(--mid2); text-transform: uppercase; white-space: nowrap; line-height: 12px; }
.tag.on { background: var(--hi); border-color: var(--hi); color: var(--bg); }
.tag.more { border-style: dashed; }
.trk.muted, .trk.dropped { opacity: 0.42; }
.trk.dropped { border-style: dashed; }
.trk.enter { opacity: 0; }
.mod.flash, .cell.flash { animation: invert 280ms steps(1, end) 2; }
@keyframes invert { 0% { filter: invert(1); } 50% { filter: none; } }
.mod.ping { animation: ping 600ms steps(1, end); }
@keyframes ping { 0%, 34% { outline: 2px solid var(--hi); outline-offset: 4px; } 35%, 66% { outline: none; } 67%, 100% { outline: 2px solid var(--hi); outline-offset: 4px; } }
#emptyMod { grid-column: 1 / -1; border-style: dashed; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px; }

/* ---- log strip ------------------------------------------------------------ */
#log { display: flex; align-items: center; gap: 18px; padding: 0 16px; background: var(--panel); border-top: 2px solid var(--mid2); overflow: hidden; white-space: nowrap; cursor: pointer; min-width: 0; color: var(--mid2); }
#logEntries { display: flex; gap: 26px; min-width: 0; }
#log .entry { flex: none; }
#log .entry b { color: var(--hi); font-weight: normal; text-transform: uppercase; }
#log .entry.err b { background: var(--hi); color: var(--bg); padding: 0 3px; }
#log .entry.new { animation: invert 300ms steps(1, end) 2; }
#logDrawer { position: absolute; left: 16px; bottom: calc(var(--log-h) + 8px); width: min(900px, calc(100% - 32px)); max-height: 50vh; overflow: auto; z-index: 20;
  background: var(--panel); border: 2px solid var(--hi); padding: 8px 12px; }
#logDrawer div { padding: 4px 0; border-bottom: 2px solid var(--off); white-space: pre-wrap; word-break: break-word; color: var(--mid2); }
#logDrawer b { color: var(--hi); font-weight: normal; }

/* ---- conversation module -------------------------------------------------------- */
#agent { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); border-left: 2px solid var(--mid2); }
#agentHead { display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 46px; border-bottom: 2px solid var(--dark); flex: none; }
#chatSrc { color: var(--mid2); text-transform: uppercase; font-size: 11px; }
.btn { background: var(--dark); border: 2px solid var(--mid); padding: 2px 8px; font-size: 11px; color: var(--hi); cursor: pointer; text-transform: uppercase; }
.btn:hover, .btn.on { border-color: var(--hi); }
.btn.on { background: var(--hi); color: var(--bg); }
#chat { flex: 1; overflow-y: auto; padding: 14px 14px 40px; font-size: 14px; line-height: 1.5; letter-spacing: 0.02em; -webkit-font-smoothing: auto;
  scrollbar-width: thin; scrollbar-color: var(--mid) transparent; }
#chat.blur, #captions.blur { filter: blur(9px); }
.msg { margin: 0 0 16px; padding-left: 12px; border-left: 2px solid var(--hi); }
.msg.hermes { border-left: 2px dashed var(--mid2); }
.who { font-size: 11px; color: var(--mid2); letter-spacing: 0.14em; display: flex; justify-content: space-between; margin-bottom: 4px; }
.body { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
.body + .body { margin-top: 8px; }
.body code { background: var(--dark); padding: 0 4px; }
.body pre { font-size: 12px; background: var(--dark); padding: 8px; overflow-x: auto; white-space: pre; margin: 6px 0; }
.body.live::after { content: "\2588"; color: var(--hi); animation: blink 0.9s steps(2, start) infinite; }
.thinking { font-size: 12px; color: var(--mid2); display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
.toolchip { margin-top: 6px; display: inline-flex; gap: 6px; align-items: center; font-size: 11px; color: var(--mid2); border: 2px solid var(--mid); padding: 0 8px; cursor: pointer; background: transparent; text-transform: uppercase; }
.toolchip:hover { color: var(--hi); border-color: var(--hi); }
.tools { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
.tool { font-size: 11px; color: var(--mid2); border: 2px solid var(--off); padding: 5px 8px; background: var(--dark); }
.tool .tname { color: var(--hi); display: flex; gap: 8px; align-items: center; }
.tool .tname .ms { margin-left: auto; color: var(--mid2); }
.tool.wl .tname::before { content: ""; width: 4px; height: 4px; background: var(--hi); }
.tool.err .tname { background: var(--hi); color: var(--bg); padding: 0 4px; }
.tool .targs, .tool .tres { white-space: pre-wrap; word-break: break-all; margin-top: 3px; max-height: 6.5em; overflow: hidden; }
#rail { display: none; flex-direction: column; align-items: center; gap: 14px; padding-top: 16px; }
#app.collapsed #rail { display: flex; }
#app.collapsed #agentHead, #app.collapsed #chat { display: none; }
#railBtn { writing-mode: vertical-rl; letter-spacing: 0.3em; }

/* ---- captions (narrow windows) ------------------------------------------------------ */
#captions { display: none; position: fixed; left: 50%; bottom: calc(var(--log-h) + 16px); transform: translateX(-50%); width: min(92vw, 900px); z-index: 30;
  background: var(--panel); border: 2px solid var(--hi); padding: 10px 16px; pointer-events: none; }
#captions .cu { font-size: 13px; color: var(--mid2); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#captions .cu::before { content: "PHIL  "; letter-spacing: 0.12em; }
#captions .ch { font-size: 18px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
#captions .ch::before { content: "HERMES  "; color: var(--mid2); font-size: 12px; }
#captions.faded { visibility: hidden; }

/* ---- overlays ------------------------------------------------------------------------- */
#offline { position: fixed; left: 0; right: 0; top: 0; z-index: 50; padding: 6px; text-align: center; background: var(--hi); color: var(--bg); letter-spacing: 0.16em; }
#help { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: var(--bg); }
#help .card { background: var(--panel); border: 2px solid var(--hi); padding: 20px 28px; font-size: 14px; line-height: 2.1; text-transform: uppercase; }
#help kbd { display: inline-block; min-width: 26px; text-align: center; border: 2px solid var(--mid2); margin-right: 14px; font-family: inherit; }

@media (max-width: 1099px) {
  #app, #app.collapsed { grid-template-columns: minmax(0, 1fr) 0; }
  #agent { display: none; }
  #captions { display: block; }
  #captions.off { display: none; }
  #rack { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding: 16px; gap: 28px 16px; }
  #tape { grid-column: 1 / -1; }
  #tl, #ear { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  #rack { grid-template-columns: minmax(0, 1fr); }
  #tape .tb { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <div id="rack">
      <svg id="cables" aria-hidden="true"></svg>

      <section class="mod" id="tape">
        <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
        <div class="mhead"><canvas class="px" data-px="TAPE" data-s="2"></canvas><span class="role" id="modeLine"></span><span class="sp"></span>
          <canvas class="px" data-px="REC" data-s="1" data-c="mid"></canvas><i class="led big" id="recLed" title="playing"></i>
          <canvas class="px" data-px="CLK" data-s="1" data-c="mid"></canvas><span class="jack" id="clkOut" title="clock out"></span></div>
        <div class="tb">
          <svg id="cassette" viewBox="0 0 120 76" aria-hidden="true">
            <rect class="body" x="1" y="1" width="118" height="74"/>
            <rect class="label" x="10" y="7" width="100" height="12"/>
            <rect class="scr" x="4" y="4" width="2" height="2"/><rect class="scr" x="114" y="4" width="2" height="2"/>
            <rect class="scr" x="4" y="70" width="2" height="2"/><rect class="scr" x="114" y="70" width="2" height="2"/>
            <circle class="pack" id="packL" cx="38" cy="38" r="12"/><circle class="pack" id="packR" cx="82" cy="38" r="12"/>
            <rect class="win" x="30" y="28" width="60" height="20" fill-opacity="0"/>
            <line class="tapeline" x1="26" y1="58" x2="94" y2="58"/>
            <circle class="hubr" cx="38" cy="38" r="6"/><circle class="hubr" cx="82" cy="38" r="6"/>
            <g id="reelL"><rect class="spoke" x="37" y="32" width="2" height="4"/><rect class="spoke" x="37" y="40" width="2" height="4"/><rect class="spoke" x="32" y="37" width="4" height="2"/><rect class="spoke" x="40" y="37" width="4" height="2"/></g>
            <g id="reelR"><rect class="spoke" x="81" y="32" width="2" height="4"/><rect class="spoke" x="81" y="40" width="2" height="4"/><rect class="spoke" x="76" y="37" width="4" height="2"/><rect class="spoke" x="84" y="37" width="4" height="2"/></g>
            <polygon class="head" points="30,75 38,62 82,62 90,75"/>
          </svg>
          <div class="readout">
            <div class="row" id="bpmRow"><canvas id="bpmPx" class="px"></canvas><canvas class="px" data-px="BPM" data-s="2" data-c="mid2"></canvas><canvas id="bpmDelta" class="px"></canvas></div>
            <div class="row"><canvas id="barPx" class="px"></canvas><canvas id="loopPx" class="px"></canvas></div>
            <div class="row"><canvas id="patPx" class="px"></canvas><canvas id="swgPx" class="px"></canvas></div>
            <div class="row hidden" id="nextRow"><canvas id="nextPx" class="px"></canvas><span id="nextLeds"><i class="led"></i> <i class="led"></i> <i class="led"></i> <i class="led"></i></span></div>
          </div>
        </div>
        <canvas id="posStrip"></canvas>
        <div id="portRow"><i class="led big" id="portLed"></i><span class="lbl-txt">MIDI OUT</span><span id="portName">NO PORT YET</span></div>
        <div id="portErr"></div>
      </section>

      <section class="mod" id="hub">
        <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
        <div class="mhead"><span class="jack sm patched" id="clkIn" title="clock in"></span><canvas class="px" data-px="HUB" data-s="2"></canvas><span class="sp"></span><span class="lbl-txt">KICK / BAR</span></div>
        <div id="hubBox"><canvas id="hubCv"></canvas></div>
      </section>

      <section class="mod" id="master">
        <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>

<script>
"use strict";
// Whiplash live view. Read-only: it renders what the plugin streams over /events and never
// sends anything back. Every moving part is driven by the state frame: knob angles are the last
// values Whiplash sent, LEDs and the note readout fire as the playhead crosses scheduled hits,
// the reels turn at a speed proportional to the BPM and stop with the transport.

const STEPS = 16;
const DPR = Math.max(1, Math.round(Math.min(window.devicePixelRatio || 1, 3)));
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const C = { bg: "#171717", panel: "#333333", mid: "#808080", mid2: "#8A8A8A", hi: "#F0F0F0", dark: "#0E0E0E", off: "#1F1F1F", dim: "#5C5C5C", dot: "#2C2C2C" };
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("whiplash." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("whiplash." + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CURVES = { linear: (p) => p, exp: (p) => p ** 3, log: (p) => 1 - (1 - p) ** 3 };
const clamp01 = (x) => Math.max(0, Math.min(1, x));

// ---- 3x5 bitmap font: every label drawn with it is real pixels, never anti-aliased -----------------
const FONT = {
  "0": "111101101101111", "1": "010110010010111", "2": "111001111100111", "3": "111001111001111", "4": "101101111001001",
  "5": "111100111001111", "6": "111100111101111", "7": "111001010010010", "8": "111101111101111", "9": "111101111001111",
  A: "010101111101101", B: "110101110101110", C: "011100100100011", D: "110101101101110", E: "111100110100111",
  F: "111100110100100", G: "011100101101011", H: "101101111101101", I: "111010010010111", J: "001001001101010",
  K: "101101110101101", L: "100100100100111", M: "101111111101101", N: "110101101101101", O: "010101101101010",
  P: "110101110100100", Q: "010101101110011", R: "110101110101101", S: "011100010001110", T: "111010010010010",
  U: "101101101101111", V: "101101101101010", W: "101101111111101", X: "101101010101101", Y: "101101010010010",
  Z: "111001010100111", " ": "000000000000000", ".": "000000000000010", "-": "000000111000000", "/": "001001010100100",
  ":": "000010000010000", "#": "101111101111101", "%": "101001010100101", "+": "000010111010000", ">": "100010001010100",
  "<": "001010100010001", "?": "111001011000010", "@": "111101101100011",
};
function pxText(cv, text, scale = 2, color = C.hi) {
  text = String(text ?? "").toUpperCase().replace(/_/g, "-").replace(/·/g, ".");
  const key = text + "|" + scale + "|" + color;
  if (cv._k === key) return;
  cv._k = key;
  const n = Math.max(1, text.length), w = (n * 4 - 1) * scale, h = 5 * scale, u = scale * DPR;
  cv.width = w * DPR; cv.height = h * DPR; cv.style.width = w + "px"; cv.style.height = h + "px";
  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = color;
  for (let i = 0; i < text.length; i++) {
    const g = FONT[text[i]] || FONT[text[i].toLowerCase()] || FONT["?"];
    for (let k = 0; k < 15; k++) if (g[k] === "1") ctx.fillRect((i * 4 + (k % 3)) * u, Math.floor(k / 3) * u, u, u);
  }
}
function paintStatic(root) {
  for (const cv of root.querySelectorAll("canvas[data-px]")) pxText(cv, cv.dataset.px, Number(cv.dataset.s || 2), C[cv.dataset.c || "hi"]);
}
function fit(canvas) {
  const w = Math.max(1, Math.round(canvas.clientWidth)), h = Math.max(1, Math.round(canvas.clientHeight));
  if (canvas.width !== w * DPR || canvas.height !== h * DPR) { canvas.width = w * DPR; canvas.height = h * DPR; }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  return [ctx, w, h];
}
function pxLine(ctx, x0, y0, x1, y1, size = 2) {   // a line made of square pixels, no anti-aliasing
  const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / (size / 2)));
  for (let i = 0; i <= n; i++) {
    const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
    ctx.fillRect(Math.round(x / size) * size, Math.round(y / size) * size, size, size);
  }
}

let S = null;               // last state frame
let frameAt = 0, lastFrameWall = 0;
const clock = { abs: null, at: 0 };   // playhead: absolute step `abs` started at page time `at`
const tracks = new Map();   // track -> module state
const energy = new Float32Array(17);
let lastStepSeen = null, seenLog = null;
let layoutDirty = true;

// ---- timing ------------------------------------------------------------------
function stepLen() { return S ? 60 / S.bpm / 4 : 0.125; }
function playheadAbs(now) {
  if (!S || !S.playing || clock.abs === null) return null;
  const p = clock.abs + (now - clock.at) / 1000 / stepLen();
  const ceiling = S.pos ? S.pos.bar * STEPS + S.pos.step + 2 : p;   // never run far past the last frame
  return Math.min(p, ceiling);
}
function syncClock(frame, now) {
  if (!frame.playing || !frame.pos) { clock.abs = null; return; }
  const abs = frame.pos.bar * STEPS + frame.pos.step;
  const at = now - frame.pos.age * 1000;                      // page time this step started
  if (clock.abs === null) { clock.abs = abs; clock.at = at; return; }
  const predicted = clock.abs + (now - clock.at) / 1000 / stepLen();
  const actual = abs + (now - at) / 1000 / stepLen();
  const err = actual - predicted;
  if (Math.abs(err) > 1) { clock.abs = abs; clock.at = at; return; }   // jump (tempo change, restart)
  clock.at -= err * 0.25 * stepLen() * 1000;   // ease toward the server's clock instead of snapping
}

// ---- state handling --------------------------------------------------------------
function onState(frame) {
  const now = performance.now();
  S = frame; frameAt = now; lastFrameWall = now;
  syncClock(frame, now);
  renderTransport();
  renderTracks();
  renderHarmony();
  renderTimeline();
  renderEar();
  renderLog();
  $("chatSrc").textContent = frame.chat_source === "hooks" ? "HOOKS" : "STATE.DB" + (frame.chat_error ? " (UNAVAILABLE)" : "");
  $("msgCount").textContent = `MSG ${S.messages_sent}`;
}

function fmtBpm(v) { return Number.isInteger(v) ? String(v) : v.toFixed(1); }
let bpmShown = null, bpmTween = null, deltaUntil = 0;
function renderTransport() {
  if (bpmShown === null) bpmShown = S.bpm;
  else if (S.bpm !== (bpmTween ? bpmTween.to : bpmShown)) {
    const delta = S.bpm - (bpmTween ? bpmTween.to : bpmShown);
    bpmTween = { from: bpmShown, to: S.bpm, t0: performance.now() };
    pxText($("bpmDelta"), (delta > 0 ? "+" : "") + fmtBpm(delta), 2, C.hi);
    deltaUntil = performance.now() + 2 * 4 * 60000 / S.bpm;
  }
  pxText($("bpmPx"), fmtBpm(bpmTween ? Math.round(bpmShown) : bpmShown), 6, S.playing ? C.hi : C.mid);
  pxText($("barPx"), S.playing ? "BAR " + String(S.bar + 1).padStart(4, "0") : "BAR ----", 2, S.playing ? C.hi : C.mid);
  let loop = S.playing ? `LOOP ${S.loop_bar + 1}/4` : "STOP";
  if (S.playing && S.bars) loop += ` PART ${S.pattern_bar + 1}/${S.bars}`;
  pxText($("loopPx"), loop, 2, C.mid2);
  pxText($("patPx"), S.pattern ? S.pattern : "IDLE", 2, S.playing ? C.hi : C.mid);
  let extra = S.playing && S.swing !== 50 ? `SWG ${S.swing}%` : "";
  if (S.playing && typeof S.humanize === "number" && S.humanize > 0) extra += ` HUM ${Math.round(S.humanize * 100)}%`;
  pxText($("swgPx"), extra.trim() || " ", 2, C.mid2);
  $("recLed").classList.toggle("on", !!S.playing);
  $("recLed").classList.toggle("blink", !!S.playing && !REDUCED);
  const next = $("nextRow");
  if (S.queued && S.playing) {
    next.classList.remove("hidden");
    next.dataset.at = S.queued.at;
    pxText($("nextPx"), `NEXT> ${S.queued.pattern} @${S.queued.at + 1}` + (S.queued.bpm && S.queued.bpm !== S.bpm ? ` ${fmtBpm(S.queued.bpm)}` : ""), 2, C.hi);
  } else next.classList.add("hidden");
  const port = S.port, led = $("portLed"), name = $("portName");
  led.className = "led big";
  if (port.lost) { led.classList.add("on", "blink", "fast"); name.innerHTML = `<span class="inv">PORT LOST: ${esc(port.lost)}</span>`; }
  else if (port.name && port.virtual && port.fallback) { led.classList.add("on", "blink"); name.innerHTML = `<span class="inv">VIRTUAL · SILENT (NO DIGITAKT)</span>`; }
  else if (port.name && port.virtual) { led.classList.add("on", "blink"); name.textContent = `VIRTUAL · ${port.name}`; }
  else if (port.name) { led.classList.add("on"); name.textContent = port.name; }
  else name.textContent = "NO PORT YET";
  $("modeLine").textContent = S.transport_mode === "clock_only" ? "CLOCK ONLY" : S.transport_mode === "start_stop" ? "START/STOP" : "";
  $("modeLine").title = S.transport_mode === "clock_only" ? "the unit's sequencer stays stopped" : S.transport_mode === "start_stop" ? "the unit's sequencer follows" : "";
  $("portErr").textContent = port.error || "";
  $("portErr").title = port.error || "";
}

// ---- track modules ------------------------------------------------------------------------
const ABBR = {
  track_level: "LVL", tune: "TUN", play_mode: "PLY", sample_start: "STA", sample_length: "LEN", loop_pos: "LOP",
  sample_level: "SLV", filter_freq: "FLT", filter_reso: "RES", filter_env_depth: "ENV", filter_attack: "FAT",
  filter_decay: "FDC", filter_sustain: "FSU", filter_release: "FRL", filter_env_delay: "FDL", filter_key_tracking: "KEY",
  amp_attack: "ATK", amp_hold: "HLD", amp_decay: "DEC", amp_sustain: "SUS", amp_release: "REL", amp_volume: "VOL",
  pan: "PAN", delay_send: "DLY", reverb_send: "REV", chorus_send: "CHO", overdrive: "DRV", bit_reduction: "BIT",
  sample_rate_reduction: "SRR", lfo1_speed: "L1S", lfo1_depth: "L1D", lfo2_speed: "L2S", lfo2_depth: "L2D",
  lfo3_speed: "L3S", lfo3_depth: "L3D",
};
const abbr = (name, cc) => ABBR[name] || (/^cc /.test(name || "") ? "C" + cc : String(name || "C" + cc).slice(0, 3));
const LEVEL_CC = 95;
const FIXED_KNOBS = [[74, "FLT"], [75, "RES"], [81, "DEC"]];   // filter_freq, filter_reso, amp_decay

const KNOB_SVG = `<svg viewBox="0 0 24 24"><circle class="kb" cx="12" cy="12" r="9"/><rect class="kc" x="11" y="11" width="2" height="2"/>
  <g class="ki"><rect class="kd" x="11" y="4" width="2" height="8"/></g><g class="kt hidden"><rect x="11" y="0" width="2" height="2"/></g></svg>`;
function makeTrack(lane) {
  const el = document.createElement("section");
  el.className = "mod trk enter";
  el.innerHTML = `<i class="screw bl"></i><i class="screw br"></i>
    <div class="mhead"><canvas class="px ttl"></canvas><span class="role"></span><span class="sp"></span><i class="led big trig" title="trig"></i><span class="jack out" title="out"></span></div>
    <div class="tb">
      <div class="fader"><div class="slot"><div class="thumb unknown"></div></div><canvas class="px" data-px="LVL" data-s="1" data-c="mid2"></canvas><span class="kv">--</span></div>
      <div class="knobs">${[0, 1, 2, 3].map(() => `<div class="knob unknown">${KNOB_SVG}<canvas class="px"></canvas><span class="kv">--</span></div>`).join("")}</div>
      <div class="nb"><div class="notebox"><canvas class="px note"></canvas></div><canvas class="px rng" title="note range with transpose (C5 = 60)"></canvas>
        <div class="bat" title="mute"><svg viewBox="0 0 16 32"><circle class="br" cx="8" cy="16" r="6"/><rect class="bl" x="6" y="2" width="4" height="14"/></svg></div>
        <canvas class="px mutelbl"></canvas></div>
    </div>
    <canvas class="strip"></canvas>
    <div class="chd hidden" title="follows the progression: the notes it plays in this chord, then in the next"></div>
    <div class="tags"></div>`;
  paintStatic(el);
  pxText(el.querySelector(".ttl"), `TRK ${lane.track}`, 2, C.hi);
  pxText(el.querySelector(".note"), "--", 2, C.mid);
  const knobs = [...el.querySelectorAll(".knob")].map((k) => ({ el: k, ind: k.querySelector(".ki"), tick: k.querySelector(".kt"), lbl: k.querySelector("canvas"),
    kv: k.querySelector(".kv"), shown: null }));
  return { el, data: lane, role: el.querySelector(".role"), tags: el.querySelector(".tags"), led: el.querySelector(".trig"), jack: el.querySelector(".jack"),
    strip: el.querySelector(".strip"), chd: el.querySelector(".chd"), note: el.querySelector(".note"), rng: el.querySelector(".rng"), lever: el.querySelector(".bat .bl"), muteLbl: el.querySelector(".mutelbl"),
    thumb: el.querySelector(".thumb"), lvlKv: el.querySelector(".fader .kv"), knobs, controls: [], ledUntil: 0, ledOn: false,
    wasDropped: false, wasFilling: false, noteText: "--" };
}
function flash(el) {
  if (REDUCED) return;
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
function renderTracks() {
  const wanted = new Set(S.lanes.map((l) => l.track));
  for (const [t, L] of tracks) {
    if (!wanted.has(t)) { L.el.remove(); tracks.delete(t); layoutDirty = true; }
  }
  for (const lane of S.lanes) {
    let L = tracks.get(lane.track);
    if (!L) {
      L = makeTrack(lane);
      tracks.set(lane.track, L);
      const hi = lane.track > 8, box = $(hi ? "tracksHi" : "tracks");
      const after = [...tracks.keys()].filter((t) => t > lane.track && (t > 8) === hi).sort((a, b) => a - b)[0];
      box.insertBefore(L.el, after !== undefined ? tracks.get(after).el : null);
      requestAnimationFrame(() => L.el.classList.remove("enter"));
      layoutDirty = true;
    }
    updateTrack(L, lane);
  }
  const anyHi = S.lanes.some((l) => l.track > 8);
  $("hiHead").classList.toggle("hidden", !anyHi);
  $("tracksHi").classList.toggle("hidden", !anyHi);
  const box = $("tracks");
  let empty = $("emptyMod");
  if (!S.lanes.length && !empty) {
    empty = document.createElement("section");
    empty.className = "mod"; empty.id = "emptyMod";
    empty.innerHTML = `<canvas class="px" data-px="NO PATTERN PLAYING" data-s="3"></canvas><span class="lbl-txt">ASK HERMES TO PLAY SOMETHING · THIS RACK FOLLOWS ALONG</span>`;
    paintStatic(empty);
    box.appendChild(empty);
    layoutDirty = true;
  } else if (S.lanes.length && empty) { empty.remove(); layoutDirty = true; }
}
function updateTrack(L, lane) {
  L.data = lane;
  L.role.textContent = lane.role || "";
  const kit = lane.kit;
  L.role.classList.toggle("kit", !!kit);
  L.role.title = kit ? `kit map: ${kit.label} (${kit.role})` : lane.role ? "assumed role: ask Hermes to label the track" : "";
  const bar = S.bar;
  const dropActive = !!(lane.drop && lane.drop.from <= bar && bar < lane.drop.back);
  const tags = [];
  // written part (whiplash_write_part) vs the generated pattern line
  if (lane.written) tags.push(`<span class="tag on" title="written part: whiplash_write_part">WR</span>`);
  if (lane.transpose) tags.push(`<span class="tag on" title="whiplash_transpose, semitones">TRN ${lane.transpose > 0 ? "+" : ""}${lane.transpose}</span>`);
  const amp = lane.amp, cuts = !!(amp && (amp.mode === "ADSR" || amp.hold_note));
  if (lane.written && lane.length) {
    const [a, b] = (lane.length || []).map(fmtLen);
    tags.push(`<span class="tag${cuts ? "" : " more"}" title="${cuts ? "note length in 16th steps (exact note-off)"
      : "note length in 16th steps: only audible with AMP MODE = ADSR or HOLD = NOTE (Whiplash has sent neither on this track)"}">LEN ${a === b ? a : a + "-" + b}</span>`);
  }
  if (amp && amp.hold_note) tags.push(`<span class="tag" title="amp_hold 127: HOLD = NOTE, the hold lasts until note-off">HLD NOTE</span>`);
  else if (amp && amp.mode) tags.push(`<span class="tag" title="amp_mode Whiplash last sent">${amp.mode}</span>`);
  if (lane.muted) tags.push(`<span class="tag on">MUTE</span>`);
  if (lane.hw) tags.push(`<span class="tag on" title="the unit's own track mute">HW</span>`);
  if (lane.drop) {
    const left = lane.drop.back - bar;
    tags.push(dropActive ? `<span class="tag on">DROP &lt;${left}</span>` : `<span class="tag">DROP NEXT</span>`);
  }
  if (lane.fill === "next") {
    const at = lane.fill_bars.find((x) => x > bar);
    tags.push(`<span class="tag">${at === bar + 1 ? "FILL NEXT" : `FILL @${at + 1}`}</span>`);
  }
  if (lane.fill === "now") tags.push(`<span class="tag on">FILL</span>`);
  if (lane.sample_slot !== null && lane.sample_slot !== undefined) {
    const sl = lane.slot_label ? ` ${esc(lane.slot_label)}` : "";
    tags.push(`<span class="tag slot" title="sample slot${lane.slot_label ? " · kit map: " + esc(lane.slot_label) : ""}">SMP ${String(lane.sample_slot).padStart(3, "0")}${sl}</span>`);
  }
  if (kit && !lane.written && !lane.loop.some((b) => b.length)) tags.push(`<span class="tag more" title="labelled, but no generated part fits: silent until whiplash_write_part">NO PART</span>`);
  if (lane.density) tags.push(`<span class="tag">DNS ${lane.density > 0 ? "+" : "-"}${Math.round(Math.abs(lane.density) * 100)}</span>`);
  // controls: LVL fader, FLT/RES/DEC knobs, and a fourth knob for whatever else Whiplash sent (ramps first)
  const rampByCc = {};
  for (const r of lane.ramps) { rampByCc[r.cc] = r; if (r._t0 === undefined) r._t0 = frameAt; }
  const byCc = {};

  $("srcLine").textContent = on ? "AUDIO · " + audio.label.toUpperCase()
    : "MIDI FALLBACK · TRIG ENVELOPE · NOT REAL AUDIO" + (audioError ? " · " + audioError.toUpperCase() : "");
  $("audioBtn").textContent = on ? "DISCONNECT" : "CONNECT AUDIO";
  $("audioBtn").classList.toggle("on", on);
  $("srcBat").querySelector(".bl").setAttribute("y", on ? "2" : "16");
}
const toggleAudio = () => (audio.an ? stopAudio() : connectAudio());
$("audioBtn").addEventListener("click", toggleAudio);
$("srcBat").addEventListener("click", toggleAudio);
$("audioDev").addEventListener("change", (e) => { store.set("audioDevice", e.target.value); connectAudio(e.target.value); });

// ---- frame loop -----------------------------------------------------------------
let lastNow = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (now - lastNow) / 1000)); lastNow = now;
  if (bpmTween) {   // digits roll to the new tempo
    const k = clamp01((now - bpmTween.t0) / 400);
    bpmShown = bpmTween.from + (bpmTween.to - bpmTween.from) * (1 - (1 - k) ** 3);
    if (k >= 1) { bpmShown = bpmTween.to; bpmTween = null; }
    pxText($("bpmPx"), fmtBpm(bpmTween ? Math.round(bpmShown) : bpmShown), 6, S && S.playing ? C.hi : C.mid);
  }
  $("bpmDelta").style.visibility = now < deltaUntil ? "visible" : "hidden";
  if (now - lastFrameWall > 3000 && es.readyState !== 1) $("offline").classList.remove("hidden");
  const ph = playheadAbs(now);
  // trigs: what Whiplash scheduled, fired as the extrapolated playhead crosses each step
  const decay = Math.exp(-dt / 0.3);
  for (let t = 1; t <= 16; t++) energy[t] *= decay;
  if (S && ph !== null) {
    const stepInt = Math.floor(ph);
    if (lastStepSeen !== null && stepInt !== lastStepSeen && stepInt - lastStepSeen < 4) {
      for (let s = lastStepSeen + 1; s <= stepInt; s++) {
        const bar = Math.floor(s / STEPS), st = s - bar * STEPS;
        if (st === 0) pulse(1);
        for (const lane of S.lanes) {
          if (!audible(lane, bar)) continue;
          const L = tracks.get(lane.track);
          for (const hit of hitsFor(lane, bar)) {
            if (hit[0] !== st) continue;
            const k = hit[2] / 127;
            energy[lane.track] = Math.max(energy[lane.track], k);
            if (!L) continue;
            L.ledUntil = now + Math.max(40, Math.min(110, stepLen() * 600));
            shake(lane.track, k);
            const text = lane.melodic ? (hit[4] || L.noteText) : `V${hit[2]}`;
            if (text !== L.noteText) { L.noteText = text; pxText(L.note, text, 2, C.hi); }
            if (/kick|bd/i.test(lane.role || "") && st !== 0) pulse(0.6 * k);
          }
        }
      }
    }
    lastStepSeen = stepInt;
    const next = $("nextRow");
    if (!next.classList.contains("hidden")) {
      const beatsLeft = Math.max(0, Math.ceil((Number(next.dataset.at) * STEPS - ph) / 4));
      [...$("nextLeds").children].forEach((el, i) => el.classList.toggle("on", i < 4 - Math.min(4, beatsLeft)));
    }
  } else lastStepSeen = null;
  if (S) {
    for (const L of tracks.values()) {
      const on = now < L.ledUntil;
      if (on !== L.ledOn) { L.ledOn = on; L.led.classList.toggle("on", on); }
      drawStrip(L, ph);
      drawControls(L, now, false);
    }
  }
  tickHarmony(ph, now);
  if (S && S.playing && S.timeline) tickTimeline(ph, now, false);
  drawEar(now);
  drawTape(ph, dt);
  drawHub(now);
  drawVu(dt, now);
  drawCables(now, dt);
  updateCaptionFade(now);
}

// ---- conversation -----------------------------------------------------------------
let CHAT = null;
let toolsOn = store.get("tools", false);
const expanded = new Set();
const turnCache = new Map();
let lastChatRev = null, captionAt = 0;

function md(text) {   // escaped first, then a safe subset: code fences, inline code, bold, bullets
  let s = esc(text);
  s = s.replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, code) => `<pre>${code}</pre>`);
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/^(\s*)[-*] /gm, "$1• ");
  return s;
}
function toolHtml(p) {
  const wl = p.name.startsWith("whiplash_");
  let track = null;
  try { const a = JSON.parse(p.args || "{}"); track = a.track || (Array.isArray(a.tracks) ? a.tracks[0] : null); } catch (e) { /* clipped args */ }
  const status = p.status === "running" ? "..." : p.ms !== null && p.ms !== undefined ? `${p.ms} MS` : "";
  return `<div class="tool${wl ? " wl" : ""}${p.status === "error" ? " err" : ""}">
    <div class="tname">${esc(p.name)}${wl && track ? ` · TRK ${esc(track)}` : ""}<span class="ms">${status}</span></div>
    ${p.args && p.args !== "{}" ? `<div class="targs">${esc(p.args)}</div>` : ""}
    ${p.result ? `<div class="tres">&gt; ${esc(p.result)}</div>` : ""}</div>`;
}
function turnHtml(t) {
  let html = "";
  if (t.user) html += `<div class="msg user"><div class="who"><span>PHIL</span><span>${hhmmss(t.ts)}</span></div><div class="body">${md(t.user)}</div></div>`;
  const texts = t.parts.filter((p) => p.kind === "text");
  const tools = t.parts.filter((p) => p.kind === "tool");
  const open = toolsOn || expanded.has(t.id);
  let inner = open
    ? t.parts.map((p) => (p.kind === "text" ? `<div class="body${p.live ? " live" : ""}">${md(p.text)}</div>` : `<div class="tools">${toolHtml(p)}</div>`)).join("")
    : texts.map((p) => `<div class="body${p.live ? " live" : ""}">${md(p.text)}</div>`).join("");
  if (t.state === "running" && !texts.some((p) => p.live)) {
    const live = [...tools].reverse().find((p) => p.status === "running") || tools[tools.length - 1];
    inner += `<div class="thinking"><i class="led on blink"></i>thinking${live && !open ? ` · ${esc(live.name)}${live.status === "running" ? "..." : ""}` : "..."}</div>`;
  }
  if (t.state === "interrupted") inner += `<div class="thinking">interrupted</div>`;
  if (t.error) inner += `<div class="thinking"><span class="inv">${esc(t.error)}</span></div>`;
  if (tools.length && !toolsOn) inner += `<button class="toolchip" data-turn="${t.id}">${tools.length} tool call${tools.length === 1 ? "" : "s"} ${expanded.has(t.id) ? "v" : "&gt;"}</button>`;
  if (inner) html += `<div class="msg hermes"><div class="who"><span>HERMES</span></div>${inner}</div>`;
  return html;
}
function renderChat(force) {
  if (!CHAT) return;
  const box = $("chat");
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const keep = new Set();
  let prevEl = null;
  for (const t of CHAT.turns) {
    keep.add(t.id);
    const sig = JSON.stringify(t) + toolsOn + expanded.has(t.id);
    let entry = turnCache.get(t.id);
    if (!entry) {
      const el = document.createElement("div"); el.className = "turn";
      entry = { el, sig: "" }; turnCache.set(t.id, entry);
      box.insertBefore(el, prevEl ? prevEl.nextSibling : box.firstChild);
    }
    if (entry.sig !== sig || force) { entry.el.innerHTML = turnHtml(t); entry.sig = sig; }
    prevEl = entry.el;
  }
  for (const [id, entry] of turnCache) if (!keep.has(id)) { entry.el.remove(); turnCache.delete(id); }
  if (!CHAT.turns.length) box.innerHTML = `<div class="thinking">${CHAT.mode === "sqlite" && CHAT.error ? "conversation unavailable: " + esc(CHAT.error) : "waiting for the conversation..."}</div>`;
  else if (box.firstElementChild && !box.firstElementChild.classList.contains("turn")) box.firstElementChild.remove();
  if (nearBottom || force) box.scrollTop = box.scrollHeight;
}
function onChat(data) {
  CHAT = data;
  if (lastChatRev !== null && data.rev !== lastChatRev && $("app").classList.contains("collapsed")) $("railLed").classList.add("on", "blink");
  lastChatRev = data.rev;
  const running = data.turns.length && data.turns[data.turns.length - 1].state === "running";
  $("chatLed").classList.toggle("blink", !!running && !REDUCED);
  renderChat(false);
  renderCaptions();
}
$("chat").addEventListener("click", (e) => {
  const chip = e.target.closest(".toolchip");
  if (!chip) return;
  const id = Number(chip.dataset.turn);
  expanded.has(id) ? expanded.delete(id) : expanded.add(id);
  renderChat(false);
});
function setTools(on) {
  toolsOn = on; store.set("tools", on);
  $("toolsBtn").classList.toggle("on", on);
  renderChat(true);
}
function setCollapsed(c) {
  $("app").classList.toggle("collapsed", c); store.set("collapsed", c);
  if (!c) $("railLed").classList.remove("on", "blink");
  $("collapseBtn").textContent = c ? "<" : ">";
  $("captions").classList.toggle("off", c);
  layoutDirty = true;
}
$("toolsBtn").addEventListener("click", () => setTools(!toolsOn));
$("collapseBtn").addEventListener("click", () => setCollapsed(true));
$("railBtn").addEventListener("click", () => setCollapsed(false));

function renderCaptions() {
  if (!CHAT || !CHAT.turns.length) return;
  const t = CHAT.turns[CHAT.turns.length - 1];
  const texts = t.parts.filter((p) => p.kind === "text");
  const last = texts[texts.length - 1];
  $("capUser").textContent = t.user || "";
  let h = last ? last.text : t.state === "running" ? "thinking..." : "";
  if (h.length > 260) h = "..." + h.slice(-260);
  $("capHermes").textContent = h;
  captionAt = performance.now();
  $("captions").classList.remove("faded");
}
function updateCaptionFade(now) {
  const running = CHAT && CHAT.turns.length && CHAT.turns[CHAT.turns.length - 1].state === "running";
  if (!running && captionAt && now - captionAt > 8000) $("captions").classList.add("faded");
}

// ---- keys ------------------------------------------------------------------------
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === "SELECT") return;
  const k = e.key.toLowerCase();
  if (k === "c") setCollapsed(!$("app").classList.contains("collapsed"));
  else if (k === "t") setTools(!toolsOn);
  else if (k === "a") toggleAudio();
  else if (k === "b") { $("chat").classList.toggle("blur"); $("captions").classList.toggle("blur"); }
  else if (k === "r") { document.body.classList.toggle("nocables"); store.set("nocables", document.body.classList.contains("nocables")); }
  else if (k === "f") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === "?" || k === "/") $("help").classList.toggle("hidden");
  else if (k === "escape") { $("help").classList.add("hidden"); $("logDrawer").classList.add("hidden"); }
});
$("help").addEventListener("click", () => $("help").classList.add("hidden"));

// ---- boot --------------------------------------------------------------------------
paintStatic(document);
pxText($("bpmPx"), "120", 6, C.mid);
if (store.get("nocables", false)) document.body.classList.add("nocables");
if (store.get("collapsed", false)) setCollapsed(true);
setTools(toolsOn);
setSource();
if (window.ResizeObserver) { const ro = new window.ResizeObserver(() => { layoutDirty = true; }); ro.observe($("rack")); ro.observe($("tracks")); ro.observe($("tracksHi")); ro.observe($("tape")); }
window.addEventListener("resize", () => { layoutDirty = true; });
let es;
function connect() {
  es = new EventSource("/events");
  es.addEventListener("open", () => $("offline").classList.add("hidden"));
  es.addEventListener("state", (e) => { try { onState(JSON.parse(e.data)); $("offline").classList.add("hidden"); } catch (err) { console.error(err); } });
  es.addEventListener("chat", (e) => { try { onChat(JSON.parse(e.data)); } catch (err) { console.error(err); } });
  es.addEventListener("error", () => { $("offline").classList.remove("hidden"); });
}
connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
