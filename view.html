<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiplash Live</title>
<style>
/* Whiplash live view, pixel-art rack. Strict grayscale: everything below is one of these tokens.
   One "art pixel" is 2 CSS px: borders, LEDs, font pixels and cable widths are all multiples of it. */
:root {
  --bg: #171717; --panel: #333333; --mid: #808080; --mid2: #8A8A8A; --hi: #F0F0F0;
  --dark: #0E0E0E; --off: #1F1F1F; --dim: #5C5C5C; --dot: #2C2C2C;
  --mono: ui-monospace, Menlo, Monaco, "Courier New", monospace;
  --agent-w: 440px; --log-h: 44px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; color: var(--hi); }
body {
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: none; -moz-osx-font-smoothing: grayscale; font-smooth: never;
  /* pegboard: small dark-gray dots on near-black */
  background-color: var(--bg);
  background-image: radial-gradient(circle, var(--dot) 1.4px, transparent 1.6px);
  background-size: 16px 16px; background-position: 8px 8px;
}
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
svg { shape-rendering: crispEdges; display: block; }
button, select { font: inherit; color: inherit; letter-spacing: inherit; }
.hidden { display: none !important; }
.up { text-transform: uppercase; }

#app { display: grid; height: 100vh; grid-template-columns: minmax(0, 1fr) var(--agent-w); }
#app.collapsed { grid-template-columns: minmax(0, 1fr) 48px; }
#main { display: grid; grid-template-rows: minmax(0, 1fr) var(--log-h); min-width: 0; min-height: 0; }

/* ---- rack --------------------------------------------------------------- */
#rack { position: relative; overflow: auto; min-height: 0; padding: 24px 24px 40px; display: grid; gap: 32px 24px; align-content: start;
  grid-template-columns: minmax(340px, 1.5fr) minmax(200px, 0.8fr) minmax(250px, 1fr); scrollbar-width: thin; scrollbar-color: var(--mid) transparent; }
#cables { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 5; overflow: visible; }
#cables path { fill: none; stroke: var(--hi); stroke-width: 2; stroke-linecap: square; }
#cables path.quiet { stroke: var(--mid); stroke-dasharray: 4 4; }
body.nocables #cables { display: none; }
.mod { position: relative; background: var(--panel); border: 2px solid var(--mid2); padding: 8px 10px 10px; min-width: 0; }
.mhead { display: flex; align-items: center; gap: 8px; height: 22px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 2px solid var(--dark); }
.mhead .sp { flex: 1; }
.role { color: var(--mid2); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lbl-txt { color: var(--mid2); text-transform: uppercase; font-size: 11px; }
.led { display: inline-block; width: 4px; height: 4px; background: var(--off); flex: none; }
.led.on { background: var(--hi); }
.led.big { width: 6px; height: 6px; }
.jack { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--dark); border: 3px solid var(--hi); flex: none; }
.jack.sm { width: 12px; height: 12px; border-width: 2px; border-color: var(--mid2); }
.jack.patched { border-color: var(--hi); }
.screw { position: absolute; width: 4px; height: 4px; background: var(--mid); }
.screw.tl { left: 3px; top: 3px; } .screw.tr { right: 3px; top: 3px; } .screw.bl { left: 3px; bottom: 3px; } .screw.br { right: 3px; bottom: 3px; }

/* tape / transport */
#tape .tb { display: flex; gap: 16px; align-items: flex-start; }
#cassette { width: 180px; height: 114px; flex: none; }
#cassette .body { fill: var(--off); stroke: var(--hi); stroke-width: 2; }
#cassette .label { fill: var(--mid); }
#cassette .win { fill: var(--dark); stroke: var(--mid); stroke-width: 2; }
#cassette .pack { fill: var(--mid); }
#cassette .hubr { fill: var(--bg); stroke: var(--hi); stroke-width: 2; }
#cassette .spoke { fill: var(--hi); }
#cassette .head { fill: var(--dark); stroke: var(--mid); stroke-width: 2; }
#cassette .tapeline { stroke: var(--mid2); stroke-width: 2; }
#cassette .scr { fill: var(--mid); }
.readout { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
#bpmRow { align-items: flex-end; }
#posStrip { width: 100%; height: 14px; margin-top: 10px; }
#barLeds { display: flex; gap: 6px; align-items: center; }
#portRow { margin-top: 10px; display: flex; align-items: center; gap: 8px; min-width: 0; }
#portName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
#portErr { color: var(--mid2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
.inv { background: var(--hi); color: var(--bg); padding: 0 4px; }
.blink { animation: blink 1s steps(2, start) infinite; }
.blink.fast { animation-duration: 0.4s; }
@keyframes blink { to { visibility: hidden; } }

/* hub */
#hub { display: flex; flex-direction: column; }
#hubBox { position: relative; flex: 1; min-height: 140px; }
#hubCv { position: absolute; inset: 0; width: 100%; height: 100%; }

/* master */
#vuBox { position: relative; height: 110px; background: var(--off); border: 2px solid var(--mid); }
#vu { position: absolute; inset: 0; width: 100%; height: 100%; }
#srcLine { margin-top: 6px; color: var(--mid2); text-transform: uppercase; font-size: 11px; min-height: 14px; }
#inJacks { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px 4px; margin-top: 8px; justify-items: center; }
#inJacks .j { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 9px; color: var(--dim); }
#masterCtl { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
#audioDev { max-width: 200px; background: var(--dark); border: 2px solid var(--mid); color: var(--hi); text-transform: uppercase; font-size: 11px; }

/* track modules */
#tracks { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 40px 24px; align-content: start; }
.trk .tb { display: grid; grid-template-columns: 26px minmax(0, 1fr) 52px; gap: 8px; align-items: start; }
.fader { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.fader .slot { position: relative; width: 4px; height: 74px; background: var(--dark); }
.fader .thumb { position: absolute; left: -9px; width: 22px; height: 8px; background: var(--mid2); border-top: 2px solid var(--hi); border-bottom: 2px solid var(--dark); }
.fader .thumb.unknown { background: transparent; border: 2px dashed var(--mid); }
.knobs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 4px; }
.knob { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.knob svg { width: 26px; height: 26px; }
.knob .kb { fill: var(--mid); }
.knob .kd, .knob .kc { fill: var(--hi); }
.knob .kt rect { fill: var(--hi); }
.knob.unknown .kb { fill: var(--dim); }
.kv { font-size: 10px; color: var(--mid2); min-height: 12px; white-space: nowrap; }
.knob.ramp .kv { color: var(--hi); }
.nb { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.notebox { width: 52px; height: 26px; background: var(--dark); border: 2px solid var(--mid); display: flex; align-items: center; justify-content: center; }
.bat svg { width: 16px; height: 32px; }
.bat .br { fill: var(--dark); stroke: var(--hi); stroke-width: 2; }
.bat .bl { fill: var(--hi); }
.strip { width: 100%; height: 12px; margin-top: 8px; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; min-height: 16px; }
.tag { font-size: 10px; padding: 0 4px; border: 2px solid var(--mid); color: var(--mid2); text-transform: uppercase; white-space: nowrap; line-height: 12px; }
.tag.on { background: var(--hi); border-color: var(--hi); color: var(--bg); }
.tag.more { border-style: dashed; }
.trk.muted, .trk.dropped { opacity: 0.42; }
.trk.dropped { border-style: dashed; }
.trk.enter { opacity: 0; }
.mod.flash { animation: invert 280ms steps(1, end) 2; }
@keyframes invert { 0% { filter: invert(1); } 50% { filter: none; } }
.mod.ping { animation: ping 600ms steps(1, end); }
@keyframes ping { 0%, 34% { outline: 2px solid var(--hi); outline-offset: 4px; } 35%, 66% { outline: none; } 67%, 100% { outline: 2px solid var(--hi); outline-offset: 4px; } }
#emptyMod { grid-column: 1 / -1; border-style: dashed; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px; }

/* ---- log strip ------------------------------------------------------------ */
#log { display: flex; align-items: center; gap: 18px; padding: 0 16px; background: var(--panel); border-top: 2px solid var(--mid2); overflow: hidden; white-space: nowrap; cursor: pointer; min-width: 0; color: var(--mid2); }
#logEntries { display: flex; gap: 26px; min-width: 0; }
#log .entry { flex: none; }
#log .entry b { color: var(--hi); font-weight: normal; text-transform: uppercase; }
#log .entry.err b { background: var(--hi); color: var(--bg); padding: 0 3px; }
#log .entry.new { animation: invert 300ms steps(1, end) 2; }
#logDrawer { position: absolute; left: 16px; bottom: calc(var(--log-h) + 8px); width: min(900px, calc(100% - 32px)); max-height: 50vh; overflow: auto; z-index: 20;
  background: var(--panel); border: 2px solid var(--hi); padding: 8px 12px; }
#logDrawer div { padding: 4px 0; border-bottom: 2px solid var(--off); white-space: pre-wrap; word-break: break-word; color: var(--mid2); }
#logDrawer b { color: var(--hi); font-weight: normal; }

/* ---- conversation module -------------------------------------------------------- */
#agent { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); border-left: 2px solid var(--mid2); }
#agentHead { display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 46px; border-bottom: 2px solid var(--dark); flex: none; }
#chatSrc { color: var(--mid2); text-transform: uppercase; font-size: 11px; }
.btn { background: var(--dark); border: 2px solid var(--mid); padding: 2px 8px; font-size: 11px; color: var(--hi); cursor: pointer; text-transform: uppercase; }
.btn:hover, .btn.on { border-color: var(--hi); }
.btn.on { background: var(--hi); color: var(--bg); }
#chat { flex: 1; overflow-y: auto; padding: 14px 14px 40px; font-size: 14px; line-height: 1.5; letter-spacing: 0.02em; -webkit-font-smoothing: auto;
  scrollbar-width: thin; scrollbar-color: var(--mid) transparent; }
#chat.blur, #captions.blur { filter: blur(9px); }
.msg { margin: 0 0 16px; padding-left: 12px; border-left: 2px solid var(--hi); }
.msg.hermes { border-left: 2px dashed var(--mid2); }
.who { font-size: 11px; color: var(--mid2); letter-spacing: 0.14em; display: flex; justify-content: space-between; margin-bottom: 4px; }
.body { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
.body + .body { margin-top: 8px; }
.body code { background: var(--dark); padding: 0 4px; }
.body pre { font-size: 12px; background: var(--dark); padding: 8px; overflow-x: auto; white-space: pre; margin: 6px 0; }
.body.live::after { content: "\2588"; color: var(--hi); animation: blink 0.9s steps(2, start) infinite; }
.thinking { font-size: 12px; color: var(--mid2); display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
.toolchip { margin-top: 6px; display: inline-flex; gap: 6px; align-items: center; font-size: 11px; color: var(--mid2); border: 2px solid var(--mid); padding: 0 8px; cursor: pointer; background: transparent; text-transform: uppercase; }
.toolchip:hover { color: var(--hi); border-color: var(--hi); }
.tools { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
.tool { font-size: 11px; color: var(--mid2); border: 2px solid var(--off); padding: 5px 8px; background: var(--dark); }
.tool .tname { color: var(--hi); display: flex; gap: 8px; align-items: center; }
.tool .tname .ms { margin-left: auto; color: var(--mid2); }
.tool.wl .tname::before { content: ""; width: 4px; height: 4px; background: var(--hi); }
.tool.err .tname { background: var(--hi); color: var(--bg); padding: 0 4px; }
.tool .targs, .tool .tres { white-space: pre-wrap; word-break: break-all; margin-top: 3px; max-height: 6.5em; overflow: hidden; }
#rail { display: none; flex-direction: column; align-items: center; gap: 14px; padding-top: 16px; }
#app.collapsed #rail { display: flex; }
#app.collapsed #agentHead, #app.collapsed #chat { display: none; }
#railBtn { writing-mode: vertical-rl; letter-spacing: 0.3em; }

/* ---- captions (narrow windows) ------------------------------------------------------ */
#captions { display: none; position: fixed; left: 50%; bottom: calc(var(--log-h) + 16px); transform: translateX(-50%); width: min(92vw, 900px); z-index: 30;
  background: var(--panel); border: 2px solid var(--hi); padding: 10px 16px; pointer-events: none; }
#captions .cu { font-size: 13px; color: var(--mid2); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#captions .cu::before { content: "PHIL  "; letter-spacing: 0.12em; }
#captions .ch { font-size: 18px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
#captions .ch::before { content: "HERMES  "; color: var(--mid2); font-size: 12px; }
#captions.faded { visibility: hidden; }

/* ---- overlays ------------------------------------------------------------------------- */
#offline { position: fixed; left: 0; right: 0; top: 0; z-index: 50; padding: 6px; text-align: center; background: var(--hi); color: var(--bg); letter-spacing: 0.16em; }
#help { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: var(--bg); }
#help .card { background: var(--panel); border: 2px solid var(--hi); padding: 20px 28px; font-size: 14px; line-height: 2.1; text-transform: uppercase; }
#help kbd { display: inline-block; min-width: 26px; text-align: center; border: 2px solid var(--mid2); margin-right: 14px; font-family: inherit; }

@media (max-width: 1099px) {
  #app, #app.collapsed { grid-template-columns: minmax(0, 1fr) 0; }
  #agent { display: none; }
  #captions { display: block; }
  #captions.off { display: none; }
  #rack { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding: 16px; gap: 28px 16px; }
  #tape { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  #rack { grid-template-columns: minmax(0, 1fr); }
  #tape .tb { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <div id="rack">
      <svg id="cables" aria-hidden="true"></svg>

      <section class="mod" id="tape">
        <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
        <div class="mhead"><canvas class="px" data-px="TAPE" data-s="2"></canvas><span class="role" id="modeLine"></span><span class="sp"></span>
          <canvas class="px" data-px="REC" data-s="1" data-c="mid"></canvas><i class="led big" id="recLed" title="playing"></i>
          <canvas class="px" data-px="CLK" data-s="1" data-c="mid"></canvas><span class="jack" id="clkOut" title="clock out"></span></div>
        <div class="tb">
          <svg id="cassette" viewBox="0 0 120 76" aria-hidden="true">
            <rect class="body" x="1" y="1" width="118" height="74"/>
            <rect class="label" x="10" y="7" width="100" height="12"/>
            <rect class="scr" x="4" y="4" width="2" height="2"/><rect class="scr" x="114" y="4" width="2" height="2"/>
            <rect class="scr" x="4" y="70" width="2" height="2"/><rect class="scr" x="114" y="70" width="2" height="2"/>
            <circle class="pack" id="packL" cx="38" cy="38" r="12"/><circle class="pack" id="packR" cx="82" cy="38" r="12"/>
            <rect class="win" x="30" y="28" width="60" height="20" fill-opacity="0"/>
            <line class="tapeline" x1="26" y1="58" x2="94" y2="58"/>
            <circle class="hubr" cx="38" cy="38" r="6"/><circle class="hubr" cx="82" cy="38" r="6"/>
            <g id="reelL"><rect class="spoke" x="37" y="32" width="2" height="4"/><rect class="spoke" x="37" y="40" width="2" height="4"/><rect class="spoke" x="32" y="37" width="4" height="2"/><rect class="spoke" x="40" y="37" width="4" height="2"/></g>
            <g id="reelR"><rect class="spoke" x="81" y="32" width="2" height="4"/><rect class="spoke" x="81" y="40" width="2" height="4"/><rect class="spoke" x="76" y="37" width="4" height="2"/><rect class="spoke" x="84" y="37" width="4" height="2"/></g>
            <polygon class="head" points="30,75 38,62 82,62 90,75"/>
          </svg>
          <div class="readout">
            <div class="row" id="bpmRow"><canvas id="bpmPx" class="px"></canvas><canvas class="px" data-px="BPM" data-s="2" data-c="mid2"></canvas><canvas id="bpmDelta" class="px"></canvas></div>
            <div class="row"><canvas id="barPx" class="px"></canvas><canvas id="loopPx" class="px"></canvas></div>
            <div class="row"><canvas id="patPx" class="px"></canvas><canvas id="swgPx" class="px"></canvas></div>
            <div class="row hidden" id="nextRow"><canvas id="nextPx" class="px"></canvas><span id="nextLeds"><i class="led"></i> <i class="led"></i> <i class="led"></i> <i class="led"></i></span></div>
          </div>
        </div>
        <canvas id="posStrip"></canvas>
        <div id="portRow"><i class="led big" id="portLed"></i><span class="lbl-txt">MIDI OUT</span><span id="portName">NO PORT YET</span></div>
        <div id="portErr"></div>
      </section>

      <section class="mod" id="hub">
        <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
        <div class="mhead"><span class="jack sm patched" id="clkIn" title="clock in"></span><canvas class="px" data-px="HUB" data-s="2"></canvas><span class="sp"></span><span class="lbl-txt">KICK / BAR</span></div>
        <div id="hubBox"><canvas id="hubCv"></canvas></div>
      </section>

      <section class="mod" id="master">
        <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
        <div class="mhead"><canvas class="px" data-px="MASTER OUT" data-s="2"></canvas><span class="sp"></span><span class="lbl-txt" id="msgCount"></span></div>
        <div id="vuBox"><canvas id="vu"></canvas></div>
        <div id="srcLine">MIDI FALLBACK · TRIG ENVELOPE · NOT REAL AUDIO</div>
        <div id="inJacks"></div>
        <div id="masterCtl">
          <div class="bat" id="srcBat" title="connect audio (A)" style="cursor:pointer"><svg viewBox="0 0 16 32"><circle class="br" cx="8" cy="16" r="6"/><rect class="bl" x="6" y="2" width="4" height="14"/></svg></div>
          <button id="audioBtn" class="btn">CONNECT AUDIO</button>
          <select id="audioDev" class="hidden" title="audio input"></select>
        </div>
      </section>

      <div id="tracks"></div>
    </div>
    <footer id="log"><canvas class="px" data-px="LOG" data-s="2"></canvas><span id="logEntries">NO WHIPLASH ACTIONS YET</span></footer>
  </div>

  <aside id="agent">
    <div id="agentHead">
      <canvas class="px" data-px="HERMES" data-s="2"></canvas><i class="led on" id="chatLed"></i>
      <span id="chatSrc"></span>
      <span style="flex:1"></span>
      <button id="toolsBtn" class="btn" title="show tool calls (T)">TOOLS</button>
      <button id="collapseBtn" class="btn" title="collapse (C)">&gt;</button>
    </div>
    <div id="chat"></div>
    <div id="rail"><button id="railBtn" class="btn" title="expand (C)">HERMES</button><i class="led" id="railLed"></i></div>
  </aside>
</div>
<div id="captions" class="faded"><div class="cu" id="capUser"></div><div class="ch" id="capHermes"></div></div>
<div id="logDrawer" class="hidden"></div>
<div id="offline" class="hidden">VIEW OFFLINE · RECONNECTING</div>
<div id="help" class="hidden"><div class="card">
  <div><kbd>C</kbd>collapse / show conversation</div>
  <div><kbd>T</kbd>show tool calls</div>
  <div><kbd>A</kbd>connect audio input</div>
  <div><kbd>B</kbd>blur conversation</div>
  <div><kbd>R</kbd>patch cables on / off</div>
  <div><kbd>F</kbd>fullscreen</div>
  <div><kbd>?</kbd>this help</div>
</div></div>

<script>
"use strict";
// Whiplash live view. Read-only: it renders what the plugin streams over /events and never
// sends anything back. Every moving part is driven by the state frame: knob angles are the last
// values Whiplash sent, LEDs and the note readout fire as the playhead crosses scheduled hits,
// the reels turn at a speed proportional to the BPM and stop with the transport.

const STEPS = 16;
const DPR = Math.max(1, Math.round(Math.min(window.devicePixelRatio || 1, 3)));
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const C = { bg: "#171717", panel: "#333333", mid: "#808080", mid2: "#8A8A8A", hi: "#F0F0F0", dark: "#0E0E0E", off: "#1F1F1F", dim: "#5C5C5C", dot: "#2C2C2C" };
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("whiplash." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("whiplash." + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CURVES = { linear: (p) => p, exp: (p) => p ** 3, log: (p) => 1 - (1 - p) ** 3 };
const clamp01 = (x) => Math.max(0, Math.min(1, x));

// ---- 3x5 bitmap font: every label drawn with it is real pixels, never anti-aliased -----------------
const FONT = {

  else if (k === "f") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === "?" || k === "/") $("help").classList.toggle("hidden");
  else if (k === "escape") { $("help").classList.add("hidden"); $("logDrawer").classList.add("hidden"); }
});
$("help").addEventListener("click", () => $("help").classList.add("hidden"));

// ---- boot --------------------------------------------------------------------------
paintStatic(document);
pxText($("bpmPx"), "120", 6, C.mid);
if (store.get("nocables", false)) document.body.classList.add("nocables");
if (store.get("collapsed", false)) setCollapsed(true);
setTools(toolsOn);
setSource();
if (window.ResizeObserver) { const ro = new window.ResizeObserver(() => { layoutDirty = true; }); ro.observe($("rack")); ro.observe($("tracks")); ro.observe($("tape")); }
window.addEventListener("resize", () => { layoutDirty = true; });
let es;
function connect() {
  es = new EventSource("/events");
  es.addEventListener("open", () => $("offline").classList.add("hidden"));
  es.addEventListener("state", (e) => { try { onState(JSON.parse(e.data)); $("offline").classList.add("hidden"); } catch (err) { console.error(err); } });
  es.addEventListener("chat", (e) => { try { onChat(JSON.parse(e.data)); } catch (err) { console.error(err); } });
  es.addEventListener("error", () => { $("offline").classList.remove("hidden"); });
}
connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
