name: whiplash
version: "0.5.2"
description: "Jam live on an Elektron Digitakt II over USB MIDI: genre/mood beats on tracks 1-8, bar-quantized switches, named params, clock-synced ramps, fills/drops/density, sample-slot select, clock-only option, mutes, tempo. No SysEx, ever."
author: pgbouncer
license: MIT
requires_hermes: ">=0.19"
# Keep in sync with pyproject.toml [project].dependencies (tests enforce it).
python_dependencies:
  - "mido>=1.3,<2"
  - "python-rtmidi>=1.5,<2"
provides_tools:
  - whiplash_list_midi_ports
  - whiplash_list_params
  - whiplash_play_pattern
  - whiplash_set_param
  - whiplash_select_sample
  - whiplash_transpose
  - whiplash_write_part
  - whiplash_ramp_param
  - whiplash_mutate
  - whiplash_mute_track
  - whiplash_unmute_track
  - whiplash_set_tempo
  - whiplash_stop
  - whiplash_status
  - whiplash_open_view
  - whiplash_close_view
# Visualiser conversation overlay only: in-memory observers that return None (see chat.py).
provides_hooks:
  - pre_llm_call
  - on_stream_start
  - on_stream_delta
  - on_stream_end
  - pre_tool_call
  - post_tool_call
  - post_llm_call
